name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Service coverage summary
        run: |
          go test ./internal/service -count=1 -coverprofile=service-coverage.out
          TOTAL=$(go tool cover -func=service-coverage.out | awk '/total:/ {print $NF}')
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- module: \`$(go tool cover -func=coverage.out | awk '/total:/ {print $NF}')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- internal/service: \`${TOTAL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Service package coverage: ${TOTAL}"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0
          args: ./... --config=./.golangci.yml
